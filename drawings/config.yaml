# keymap-drawer config for the TH40. Regeneration recipe is in the README.
parse_config:
  raw_binding_map:
    # --- tmux macros (send_macro table in keymap.c); ⌃b is TMUX_PFX ---
    "T_NEWW": {t: "new win", h: "⌃b c"}
    "T_SPLTV": {t: "split │", h: "⌃b %"}
    "T_SPLTH": {t: "split ─", h: "⌃b \""}
    "T_ZOOM": {t: "zoom", h: "⌃b z"}
    "T_KILLP": {t: "kill pane", h: "⌃b x"}
    "T_PANEL": {t: "pane ◀", h: "⌃b ←"}
    "T_PANED": {t: "pane ▼", h: "⌃b ↓"}
    "T_PANEU": {t: "pane ▲", h: "⌃b ↑"}
    "T_PANER": {t: "pane ▶", h: "⌃b →"}
    "T_LASTW": {t: "last win", h: "⌃b l"}
    "T_PREVW": {t: "prev win", h: "⌃b p"}
    "T_NEXTW": {t: "next win", h: "⌃b n"}
    "T_LISTW": {t: "choose win", h: "⌃b w"}
    "T_SESS": {t: "session", h: "⌃b s"}
    "T_DETACH": {t: "detach", h: "⌃b d"}
    # --- plain keys and layer taps, spelled out rather than left as raw QMK ---
    "KC_LCTL": "Ctrl"
    "LT(_NAV,KC_TAB)": {t: "Tab", h: "hold Nav"}
    "OSL(_NUM)": {t: "Num", h: "one-shot"}
    "LT(_NUM,KC_SPC)": {t: "Space", h: "hold Num"}
    "LT(_NAV,KC_SPC)": {t: "Space", h: "hold Nav"}
    "LT(_MEDIA,KC_SPC)": {t: "Fn", h: "hold System"}
    "TO(_BASE)": {t: "Base", h: "drop all"}
    "MO(_WM)": {t: "Tmux + Windows", h: "while held"}
    "MO(_SPR1)": {t: "Spare 6", h: "while held"}
    "MO(_SPR2)": {t: "Spare 7", h: "while held"}
    "TG(_WM)": {t: "Tmux + Windows", h: "stay"}
    "TG(_SPR1)": {t: "Spare 6", h: "stay"}
    "TG(_SPR2)": {t: "Spare 7", h: "stay"}
    # --- persistent settings keys ---
    "UC_LOCKB": {t: "Lock", h: "at boot"}
    "UC_CLEDS": {t: "Lamps", h: "on/off"}
    "UC_BRTU": {t: "Lamp +", h: "bright"}
    "UC_BRTD": {t: "Lamp −", h: "bright"}
    "UC_HRM": {t: "HRM", h: "base swap"}
    "UC_AURA": {t: "Aura", h: "effect"}
    "UC_RAIN": {t: "Rain", h: "effect"}
    "RM_TOGG": {t: "Backlight", h: "on/off"}
    # --- tap dances and specials ---
    "TD_SFT": {t: "⇧", h: "tap ×2 Caps"}
    "TD_MPLY": {t: "Play", h: "×2 next ×3 prev"}
    "QK_GESC": {t: "Esc", s: "~"}
    "QK_LLCK": {t: "Layer", h: "lock"}
    "QK_LOCK": {t: "Key", h: "lock"}
    "SE_LOCK": {t: "Lock", h: "keyboard"}
    "CW_TOGG": {t: "Caps", h: "Word"}
    "QK_REP": "Repeat"
    "QK_AREP": "AltRep"
    "CG_TOGG": {t: "Ctrl⇄Gui"}
    "SH_TOGG": {t: "Mirror", h: "one-hand"}
    "S(KC_SLSH)": "?"
    "KC_NUBS": {t: "\\", s: "|"}
    # --- Claude keys ---
    "KC_F21": {t: "◆", h: "Claude"}
    "KC_F22": {t: "✓", h: "approve"}
    "KC_F23": {t: "✕", h: "interrupt"}
    # --- home row mods (HRM layer) ---
    "HM_A": {t: "A", h: "Gui"}
    "HM_S": {t: "S", h: "Alt"}
    "HM_D": {t: "D", h: "Ctrl"}
    "HM_F": {t: "F", h: "Shift"}
    "HM_J": {t: "J", h: "Shift"}
    "HM_K": {t: "K", h: "Ctrl"}
    "HM_L": {t: "L", h: "Alt"}
    # --- media ---
    "KC_MPRV": "Prev"
    "KC_MNXT": "Next"
    "KC_VOLD": "Vol −"
    "KC_VOLU": "Vol +"
    # --- dynamic macros ---
    "DM_REC1": {t: "⏺ 1", h: "record"}
    "DM_PLY1": {t: "▶ 1", h: "play"}
    "DM_REC2": {t: "⏺ 2", h: "record"}
    "DM_PLY2": {t: "▶ 2", h: "play"}
    "DM_RSTP": {t: "⏹", h: "stop rec"}
    # --- Hyprland layer, labelled by what omarchy does with the chord ---
    "LGUI(KC_1)": {t: "1", h: "go to ws"}
    "LGUI(KC_2)": {t: "2", h: "go to ws"}
    "LGUI(KC_3)": {t: "3", h: "go to ws"}
    "LGUI(KC_4)": {t: "4", h: "go to ws"}
    "LGUI(KC_5)": {t: "5", h: "go to ws"}
    "LGUI(KC_6)": {t: "6", h: "go to ws"}
    "LGUI(KC_7)": {t: "7", h: "go to ws"}
    "LGUI(KC_8)": {t: "8", h: "go to ws"}
    "LGUI(KC_9)": {t: "9", h: "go to ws"}
    "LGUI(KC_0)": {t: "10", h: "go to ws"}
    "LGUI(KC_W)": {t: "Close", h: "window"}
    "LGUI(KC_F)": {t: "Full", h: "screen"}
    "LGUI(KC_LEFT)": {t: "◀", h: "focus"}
    "LGUI(KC_DOWN)": {t: "▼", h: "focus"}
    "LGUI(KC_UP)": {t: "▲", h: "focus"}
    "LGUI(KC_RIGHT)": {t: "▶", h: "focus"}
draw_config:
  dark_mode: auto
  n_columns: 2
  key_w: 78
  key_h: 64
  combo_w: 34
  combo_h: 26
  inner_pad_w: 3
  inner_pad_h: 3
  small_pad: 3
  shrink_wide_legends: 10
  append_colon_to_layer_header: false
  footer_text: "broisnischal/keyboard · Epomaker TH40 · custom QMK"
  svg_extra_style: |
    svg.keymap { font-family: "Inter", "Segoe UI", "Noto Sans", "Helvetica Neue", sans-serif; }
    rect.key.trans { opacity: 0.45; }
    text.trans { opacity: 0.35; }
    text.label { font-weight: 650; font-size: 15px; }
    text.combo { font-size: 10px; }
